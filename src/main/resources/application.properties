spring.application.name=smsgateway

server.port=8080

# ==========================================================
# DATABASE
# URL, username and password are provided by environment variables.
# ==========================================================

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================================
# FRONTEND URLS
# ==========================================================

app.frontend.reset-url.client=${APP_FRONTEND_RESET_URL_CLIENT:http://localhost:3001/reset-password}
app.frontend.reset-url.manager=${APP_FRONTEND_RESET_URL_MANAGER:http://localhost:3001/api/V1/manager/password/reset}

# ==========================================================
# SMTP
# Sensitive values are provided by environment variables.
# ==========================================================

spring.mail.host=${SPRING_MAIL_HOST:solutech-one.com}
spring.mail.port=${SPRING_MAIL_PORT:465}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS_ENABLE:true}
spring.mail.protocol=${SPRING_MAIL_PROTOCOL:smtp}
spring.mail.properties.mail.smtp.ssl.enable=${SPRING_MAIL_SSL_ENABLE:true}

# ==========================================================
# CORS
# ==========================================================

app.security.cors.allowed-origin-patterns=${APP_SECURITY_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3001,https://client.i-onsms.es,https://backoffice.i-onsms.es}
app.security.cors.allowed-methods=${APP_SECURITY_CORS_ALLOWED_METHODS:*}
app.security.cors.allowed-headers=${APP_SECURITY_CORS_ALLOWED_HEADERS:*}
app.security.cors.exposed-headers=${APP_SECURITY_CORS_EXPOSED_HEADERS:Authorization,Content-Disposition}
app.security.cors.allow-credentials=${APP_SECURITY_CORS_ALLOW_CREDENTIALS:true}
app.security.cors.max-age=${APP_SECURITY_CORS_MAX_AGE:3600}