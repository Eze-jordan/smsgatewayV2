spring.application.name=smsgateway

server.port=8080

# ==========================================================
# DATABASE
# URL, username and password are provided by environment variables.
# ==========================================================

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================================
# FRONTEND URLS
# ==========================================================
# URL des pages de reinitialisation
#app.frontend.reset-url.client=${APP_FRONTEND_RESET_URL_CLIENT:http://localhost:3001/reset-password}
#app.frontend.reset-url.manager=${APP_FRONTEND_RESET_URL_MANAGER:http://localhost:3001/api/V1/manager/password/reset}

# URL des pages de réinitialisation
app.frontend.reset-url.client=${APP_FRONTEND_RESET_URL_CLIENT:https://client.i-onsms.es/reset-password}
app.frontend.reset-url.manager=${APP_FRONTEND_RESET_URL_MANAGER:https://backoffice.i-onsms.es/reset-password}
# ==========================================================
# SMTP
# Sensitive values are provided by environment variables.
# ==========================================================

spring.mail.host=${SPRING_MAIL_HOST:solutech-one.com}
spring.mail.port=${SPRING_MAIL_PORT:465}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS_ENABLE:true}
spring.mail.protocol=${SPRING_MAIL_PROTOCOL:smtp}
spring.mail.properties.mail.smtp.ssl.enable=${SPRING_MAIL_SSL_ENABLE:true}

# ==========================================================
# CORS
# ==========================================================

app.security.cors.allowed-origin-patterns=${APP_SECURITY_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3001,https://client.i-onsms.es,https://backoffice.i-onsms.es}
app.security.cors.allowed-methods=${APP_SECURITY_CORS_ALLOWED_METHODS:*}
app.security.cors.allowed-headers=${APP_SECURITY_CORS_ALLOWED_HEADERS:*}
app.security.cors.exposed-headers=${APP_SECURITY_CORS_EXPOSED_HEADERS:Authorization,Content-Disposition}
app.security.cors.allow-credentials=${APP_SECURITY_CORS_ALLOW_CREDENTIALS:true}
app.security.cors.max-age=${APP_SECURITY_CORS_MAX_AGE:3600}

# ==========================================================
# DEFAULT MANAGER
# Values are loaded from environment variables.
# ==========================================================

app.bootstrap.default-manager.enabled=${APP_DEFAULT_MANAGER_ENABLED:false}
app.bootstrap.default-manager.id=${APP_DEFAULT_MANAGER_ID:}
app.bootstrap.default-manager.nom=${APP_DEFAULT_MANAGER_NOM:}
app.bootstrap.default-manager.prenom=${APP_DEFAULT_MANAGER_PRENOM:}
app.bootstrap.default-manager.email=${APP_DEFAULT_MANAGER_EMAIL:}
app.bootstrap.default-manager.telephone=${APP_DEFAULT_MANAGER_TELEPHONE:}
app.bootstrap.default-manager.password=${APP_DEFAULT_MANAGER_PASSWORD:}
app.bootstrap.default-manager.role=${APP_DEFAULT_MANAGER_ROLE:SUPER_ADMIN}

# URL de connexion des interfaces
app.frontend.login-url.client=${APP_FRONTEND_LOGIN_URL_CLIENT:https://client.i-onsms.es/login}
app.frontend.login-url.manager=${APP_FRONTEND_LOGIN_URL_MANAGER:https://backoffice.i-onsms.es/login}

# Adresse utilisee pour envoyer les e-mails
app.mail.from=${APP_MAIL_FROM:noreply@solutech-one.com}